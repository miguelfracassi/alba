<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c3a"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"><style id="alba-css">
:root{--navy:#111c3a;--ink:#0b1226;--gold:#e8c872;--mist:#e8eaf5;--line:#e9ebf2;--muted:#6b7390;--text:#121a33;--red:#d6303c;--bg:#fff;--soft:#f5f6fb;
--serif:'Newsreader',Georgia,serif;--sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.45 var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.av{position:relative;display:inline-grid;place-items:center;width:var(--s,44px);height:var(--s,44px);border-radius:50%;background:var(--mist);color:var(--navy);font-weight:700;font-size:calc(var(--s,44px)*.36);overflow:hidden;flex:none;user-select:none}
.av.dark{background:var(--navy);color:#fff}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{width:16px;height:16px;color:var(--navy);vertical-align:-2px;margin-left:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 20px;border-radius:999px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;transition:background .15s,opacity .15s}
.btn:hover{background:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:34px;padding:0 16px;font-size:14px}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1px #cfd3e3}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--red)}
.btn.block{width:100%}
.app-wrap{display:grid;grid-template-columns:minmax(72px,275px) minmax(0,600px) minmax(0,350px);justify-content:center;gap:0 28px;max-width:1280px;margin:0 auto}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 20px;overflow:auto}
.side .logo{display:block;padding:6px 14px 18px}.side .logo img{width:46px;display:block}
.nav a,.nav button{position:relative;display:flex;align-items:center;gap:18px;width:100%;padding:12px 14px;border-radius:999px;font-size:20px;text-align:left}
.nav a:hover,.nav button:hover{background:var(--soft)}
.nav .on{font-weight:700}.nav .on .ico{stroke-width:2.3}
.nav .pip{position:absolute;left:30px;top:6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.side .post-btn{margin:16px 12px 0;min-height:52px;font-size:17px}
.me-card{margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px;border-radius:999px;position:relative;width:100%;text-align:left}
.me-card:hover{background:var(--soft)}
.me-card b{display:block;font-size:15px;line-height:1.2}.me-card small{color:var(--muted)}
.me-card .who{min-width:0;flex:1}.me-card .who>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;z-index:30;bottom:calc(100% + 6px);left:0;min-width:240px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line),0 12px 36px rgba(17,28,58,.18);padding:6px}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:10px;font-weight:600;font-size:15px;text-align:left}
.menu a:hover,.menu button:hover{background:var(--soft)}
.menu .ico{width:20px;height:20px}
main{min-width:0;border-inline:1px solid var(--line);min-height:100vh}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;padding:14px 18px;font-weight:800}
.tabs{display:flex}
.tabs button,.tabs a{flex:1;text-align:center;padding:16px 8px;color:var(--muted);font-weight:600;position:relative;white-space:nowrap}
.tabs button:hover,.tabs a:hover{background:var(--soft)}
.tabs .on{color:var(--text);font-weight:700}
.tabs .on::after{content:"";position:absolute;left:50%;bottom:0;width:56px;height:4px;border-radius:4px 4px 0 0;background:var(--navy);transform:translateX(-50%)}
.empty{padding:56px 28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:6px}
.more{display:block;width:100%;padding:18px;color:var(--navy);font-weight:600}.more:hover{background:var(--soft)}
.pad{padding:18px}
.composer{display:flex;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.composer .box{flex:1;min-width:0}
.composer textarea{width:100%;border:0;outline:0;resize:none;font-size:20px;line-height:1.4;padding:8px 0 12px;min-height:56px;background:none}
.composer textarea::placeholder{color:#8b92ab}
.composer .mode{display:none;align-items:center;gap:8px;margin:2px 0 8px;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600;color:var(--navy)}
.composer.prayer .mode{display:flex}
.composer .bar{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.composer .tool{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--navy)}
.composer .tool:hover,.composer .tool.on{background:var(--mist)}
.composer .tool .ico{width:21px;height:21px}
.composer .count{margin-left:auto;margin-right:10px;color:var(--muted);font-size:14px}
.composer .count.warn{color:var(--red)}
.preview{position:relative;margin:0 0 10px}.preview img{width:100%;max-height:340px;object-fit:cover;border-radius:16px;display:block}
.preview button{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(11,18,38,.75);color:#fff;font-size:18px;line-height:1}
.post{display:flex;gap:12px;padding:14px 18px 6px;border-bottom:1px solid var(--line);position:relative}
.post:hover{background:#fcfcfe}
.post .col{flex:1;min-width:0}
.post .head{display:flex;align-items:baseline;gap:6px;min-width:0;padding-right:34px}
.post .head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .head span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.post .more-btn{position:absolute;right:14px;top:10px;width:34px;height:34px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.post .more-btn:hover{background:var(--mist);color:var(--navy)}
.post .body{white-space:pre-wrap;word-break:break-word;margin-top:2px;font-size:16px}
.post .body a{color:var(--navy);font-weight:500}.post .body a:hover{text-decoration:underline}
.post .img{display:block;margin-top:12px;border-radius:18px;overflow:hidden;border:1px solid var(--line)}.post .img img{display:block;width:100%;max-height:520px;object-fit:cover}
.actions{display:flex;justify-content:space-between;align-items:center;margin:6px -8px 0 -8px;max-width:440px}
.act{display:flex;align-items:center;gap:7px;padding:8px;border-radius:999px;color:var(--muted);font-size:14px;min-width:44px}
.act .ico{width:19px;height:19px}
.act:hover{color:var(--navy);background:var(--soft)}
.act.like.on{color:var(--red)}.act.like.on .ico{fill:currentColor}
.act.rep.on{color:#16794c}
.act.save.on{color:var(--navy)}.act.save.on .ico{fill:currentColor}
.prayer-card{display:flex;align-items:center;gap:14px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.prayer-card .flame{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.prayer-card .flame .ico{width:19px;height:19px}
.prayer-card div{flex:1;min-width:0}.prayer-card b{display:block;font-size:15px}.prayer-card small{color:var(--muted);font-size:14px}
.prayer-card .btn.on{background:var(--gold);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
a.row:hover,button.row:hover{background:#fcfcfe}
.row .info{flex:1;min-width:0}.row .info>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .info b{display:block}.row .info small{color:var(--muted);display:block}
.row.unread{background:#f6f8ff}
.row .tag{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--navy)}
.row .tag .ico{width:17px;height:17px}
.row .tag.like{background:#fde9eb;color:var(--red)}
.row .when{color:var(--muted);font-size:14px;flex:none}
.cover{height:140px;background:linear-gradient(180deg,#26335e 0%,#4a5a8a 55%,#e8c872 140%)}
.profile{padding:0 18px 14px;border-bottom:1px solid var(--line)}
.profile .top-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-52px}
.profile .av{--s:104px;border:4px solid #fff}
.profile h2{font-size:22px;margin-top:10px;line-height:1.2}
.profile .at{color:var(--muted)}
.profile p{margin-top:10px;white-space:pre-wrap}
.profile .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--muted);font-size:15px}
.profile .meta b{color:var(--text)}
.profile .meta a:hover{text-decoration:underline}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--muted);margin-top:5px;font-size:13px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #cfd3e3;background:#fff;outline:0;font-size:16px}
.input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(17,28,58,.12)}
textarea.input{resize:vertical;min-height:84px}
.msg{padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;display:none}
.msg.err{display:block;background:#fdecee;color:#9b1c28}
.msg.ok{display:block;background:#e7f6ee;color:#14663f}
.section{padding:22px 18px;border-bottom:1px solid var(--line)}
.section h2{font-size:18px;margin-bottom:4px}.section>p{color:var(--muted);font-size:14px;margin-bottom:16px}
.avatar-edit{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.avatar-edit .av{--s:84px}
.avatar-edit .acts{display:flex;gap:8px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;height:calc(100vh - 62px)}
.chat .log{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:78%;padding:9px 14px;border-radius:18px;background:var(--mist);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.bubble.mine{align-self:flex-end;background:var(--navy);color:#fff}
.chat form{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.chat form .input{border-radius:999px}
.back{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;margin-right:4px}.back:hover{background:var(--soft)}
.head-row{display:flex;align-items:center;gap:10px;padding:10px 14px}.head-row b{font-size:18px}
.rail{padding:10px 0 40px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.search{display:flex;align-items:center;gap:12px;padding:0 18px;height:50px;border-radius:999px;background:var(--soft);color:var(--muted);margin-bottom:16px}
.search:focus-within{background:#fff;box-shadow:0 0 0 2px var(--navy);color:var(--navy)}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.card{border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-bottom:16px}
.card h2{font-size:22px;margin:0 0 12px 4px;font-weight:800}
.litur{background:linear-gradient(160deg,#111c3a,#0b1226);color:#fff;border-radius:16px;padding:16px 18px}
.litur .date{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#c7cde2}
.litur .date::before{content:"";width:8px;height:8px;border-radius:50%;background:#46b36b;flex:none}
.litur q{display:block;margin:12px 0;font:400 21px/1.5 var(--serif);quotes:"“" "”"}
.litur .ref{font-size:14px;font-weight:600;color:var(--gold)}.litur .ref a:hover{text-decoration:underline}
.sug{display:flex;align-items:center;gap:10px;padding:9px 4px}
.sug .info{flex:1;min-width:0}.sug .info b,.sug .info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .info small{color:var(--muted);font-size:14px}
.sug .btn{background:#0f0f14}
.sug .btn.ghost{background:#fff}
.trend{display:block;padding:9px 4px}.trend:hover b{text-decoration:underline}
.trend small{display:block;color:var(--muted);font-size:13.5px}.trend b{display:block;font-size:16px}
.card .link{display:inline-block;margin:6px 4px 0;color:var(--navy);font-weight:600}
.foot{padding:0 6px;color:var(--muted);font-size:13px;line-height:1.7}.foot a:hover{text-decoration:underline}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(11,18,38,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:20px;padding:24px;max-width:420px;width:100%}
.modal h3{font-size:20px;margin-bottom:6px}.modal p{color:var(--muted);margin-bottom:16px;font-size:15px}
.modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.dawn{min-height:100vh;color:#fff;background:radial-gradient(120% 70% at 50% 108%,#e8c872 0%,#b9855a 14%,#4a5a8a 38%,#1a2750 62%,#0b1226 90%);display:flex;flex-direction:column;position:relative;overflow:hidden}
.dawn header{display:flex;align-items:center;gap:12px;padding:22px clamp(20px,5vw,56px)}
.dawn header img{width:40px}.dawn header b{font-size:22px;letter-spacing:.01em}
.dawn header nav{margin-left:auto;display:flex;gap:10px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6vh clamp(20px,5vw,56px) 14vh;max-width:980px}
.hero h1{font:400 clamp(40px,7.4vw,92px)/1.04 var(--serif);letter-spacing:-.02em;max-width:13em}
.hero p{margin-top:22px;max-width:34em;font-size:clamp(16px,1.6vw,19px);color:#d8dcec}
.hero .cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;border-radius:999px;font-weight:700;font-size:16px;background:#fff;color:var(--ink);transition:transform .15s,background .15s}
.pill:hover{background:var(--gold)}
.pill.out{background:rgba(11,18,38,.45);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.pill.out:hover{background:rgba(255,255,255,.14)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:26px clamp(20px,5vw,56px) 34px;border-top:1px solid rgba(255,255,255,.18);background:rgba(11,18,38,.55)}
.three b{display:block;font-size:17px;margin-bottom:4px}.three span{color:#c7cde2;font-size:15px}
.authbox{margin:auto;width:100%;max-width:420px;padding:32px 28px;background:#fff;color:var(--text);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.authbox img{width:46px;display:block;margin-bottom:14px}
.authbox h1{font:500 30px/1.15 var(--serif);margin-bottom:6px}.authbox>p{color:var(--muted);margin-bottom:22px;font-size:15px}
.authbox .alt{text-align:center;margin-top:18px;color:var(--muted);font-size:15px}.authbox .alt a{color:var(--navy);font-weight:700}
.authpage{padding:20px;justify-content:center}
@media (max-width:1100px){.rail{display:none}.app-wrap{grid-template-columns:minmax(72px,240px) minmax(0,620px)}}
@media (max-width:860px){
.app-wrap{grid-template-columns:minmax(0,1fr);gap:0}
.side{position:fixed;z-index:40;inset:auto 0 0 0;height:auto;flex-direction:row;padding:0 4px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.side .logo,.side .post-btn,.me-card,.nav .lbl,.nav .extra{display:none}
.nav{display:flex;width:100%;justify-content:space-around}
.nav a,.nav button{width:auto;padding:14px;gap:0}
.nav .pip{left:auto;right:4px;top:6px}
main{border:0;padding-bottom:64px}
.chat{height:calc(100vh - 126px)}
.three{grid-template-columns:1fr}
.toast{bottom:90px}
}
@media (prefers-reduced-motion:no-preference){.hero h1,.hero p,.hero .cta{animation:rise .8s both}.hero p{animation-delay:.12s}.hero .cta{animation-delay:.24s}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pip[hidden],.empty[hidden]{display:none!important}
:root{--gold-d:#b8902f}
.top h1,.section h2,.card h2,.authbox h1,.modal h3,.empty b,.profile h2{font-family:var(--serif);font-weight:500;letter-spacing:-.005em}
.top h1{font-size:24px}
.card h2{font-size:24px;margin:0 0 14px 2px}
.card h2::after{content:"";display:block;width:30px;height:2px;margin-top:7px;background:var(--gold-d)}
.section h2{font-size:23px}
.empty b{font-size:22px}
.profile h2{font-size:26px;font-weight:600}
.tabs .on::after{background:var(--gold-d);height:3px;width:44px}
.card{border-radius:14px;border-color:#e3e5ee}
.card#sug,.card#trend{border-top:2px solid var(--gold-d)}
.litur{border-radius:4px 22px 4px 22px;border-top:3px solid var(--gold);box-shadow:0 10px 28px rgba(17,28,58,.18)}
.litur q{font-size:22px;font-style:italic}
.litur q::before{content:"“";display:block;font:400 54px/.6 var(--serif);color:var(--gold);margin-bottom:6px}
.litur q{quotes:none}
.btn.sm{border-radius:10px}
.sug .btn{background:var(--navy);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(232,200,114,.45)}
.sug .btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1px #cfd3e3}
.prayer-card{border-radius:4px 16px 16px 4px;background:#fbf8ee;border:1px solid #efe3bb;border-left:3px solid var(--gold-d)}
.prayer-card .flame{background:var(--gold);color:var(--navy)}
.prayer-card b{font-family:var(--serif);font-size:17px;font-weight:600}
.prayer-card .btn{background:var(--navy);color:var(--gold)}
.prayer-card .btn.on{background:var(--gold);color:var(--ink)}
.composer.prayer .mode{background:#fbf8ee;color:var(--navy);border-left:3px solid var(--gold-d);border-radius:4px 12px 12px 4px}
.search{border-radius:12px}
.menu{border-radius:12px}
.modal .box{border-radius:6px 24px 6px 24px}
.authbox{border-radius:6px 28px 6px 28px;border-top:3px solid var(--gold)!important}
.authbox h1{font-size:34px}
.input{border-radius:10px}
.trend b{font-family:var(--serif);font-size:18px;font-weight:600}
.dawn{min-height:100vh}
body:not(.authpage) .dawn+.sec{padding-top:90px}
.sec{padding:84px clamp(20px,5vw,56px)}
.sec.soft{background:var(--soft)}
.split{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,80px);align-items:center}
.split.rev .txt{order:2}
.txt h2,.wrap h2,.end h2{font:500 clamp(30px,4vw,46px)/1.1 var(--serif);letter-spacing:-.015em;margin-bottom:18px}
.txt p{font-size:18px;color:#454d6a;margin-bottom:12px;max-width:30em}
.demo{pointer-events:none;user-select:none}
.d-post{display:flex;gap:12px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:6px 22px 6px 22px;box-shadow:0 20px 50px rgba(17,28,58,.12)}
.d-post p{margin:6px 0 0}.mut{color:var(--muted);font-size:14px}
.d-list{padding:24px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold-d);border-radius:4px 4px 22px 4px;box-shadow:0 20px 50px rgba(17,28,58,.1)}
.d-list .serif{font:600 24px var(--serif);display:block;margin-bottom:10px}
