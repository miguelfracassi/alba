<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c3a"><link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"><link rel="stylesheet" href="/style.css"><title>Criar conta · Alba</title></head>
<body class="dawn authpage"><main class="authbox" style="border:0;min-height:0"><a href="/"><img src="/logo.png" alt="Alba"></a><h1>Seja bem-vindo à Alba</h1><p>Leva menos de um minuto.</p>
<form id="f" novalidate><div class="msg" id="m" role="alert"></div><label class="field"><span>Nome</span><input class="input" name="name" maxlength="50" autocomplete="name" required autofocus></label><label class="field"><span>Nome de usuário</span><input class="input" name="username" maxlength="20" autocomplete="username" autocapitalize="none" required><small>Letras minúsculas, números, _ ou ponto.</small></label><label class="field"><span>E-mail</span><input class="input" type="email" name="email" autocomplete="email" required></label><label class="field"><span>Senha</span><input class="input" type="password" name="password" minlength="8" autocomplete="new-password" required><small>Mínimo de 8 caracteres.</small></label><button class="btn block" style="min-height:48px">Criar conta</button></form>
<div class="alt">Já tem conta? <a href="/login">Entrar</a></div></main><script src="/js/auth.js"></script></body></html>
